<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src file:; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'" />
  <title>moonlighthere production</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Иконки -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h2.2v14H6zM19 5v14L9.5 12z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M15.8 5H18v14h-2.2zM5 5v14l9.5-7z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="currentColor" d="M11.5 6v12L3 12zM21 6v12l-8.5-6z"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 6v12L21 12zM3 6v12l8.5-6z"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h3.5c2 0 3.2-1 4.3-2.7l2.4-3.6C14.3 8.9 15.5 8 17.5 8H21M3 7h3.5c1.4 0 2.4.5 3.2 1.4M13.5 15.6c.8.9 1.9 1.4 3.3 1.4H21M18 5l3 3-3 3M18 14l3 3-3 3"/></g></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></g></symbol>
      <symbol id="i-repeat1" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3M11 10l1.5-1v6"/></g></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></g></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></g></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 3 4H7l3-4z"/></g></symbol>
    </defs>
  </svg>

  <!-- Фон -->
  <div id="bg"></div>
  <div id="bg-dim"></div>
  <div id="vignette"></div>

  <header class="titlebar">
    <div class="win-buttons">
      <button id="btn-min">–</button>
      <button id="btn-max">▢</button>
      <button id="btn-close" class="close">✕</button>
    </div>
  </header>

  <div id="brand">moonlighthere production</div>

  <!-- Виджет «сейчас играет» (можно перетаскивать) -->
  <div id="now" class="now glass" title="Клик — пауза / воспроизведение, зажми и тяни — переместить">
    <div class="mini-cover">
      <img id="cover" alt="" hidden />
      <div class="cover-ph" id="cover-ph">♪</div>
      <div class="ov"><svg class="i js-play-ico"><use href="#i-play"/></svg></div>
    </div>
    <div class="now-text">
      <div id="title">Ничего не играет</div>
      <div id="sub">Наведи мышь на правый край окна</div>
      <div class="mini-bar"><i id="mini-fill"></i></div>
    </div>
  </div>

  <!-- Правая панель -->
  <div id="hotzone"><span class="handle">‹</span></div>
  <aside id="drawer">
    <div class="tabs">
      <button data-tab="tracks" class="on">Треки</button>
      <button data-tab="settings">Настройки</button>
      <span class="spacer"></span>
      <button id="btn-pin" class="pin" title="Закрепить панель"><svg class="i"><use href="#i-pin"/></svg></button>
    </div>

    <section class="tab" id="tab-tracks">
      <div class="list-head">
        <input type="search" id="search" placeholder="Поиск по трекам…" />
        <span id="count"></span>
      </div>
      <div class="hint">ПКМ по треку — выбрать свою обложку</div>
      <ul id="tracklist"></ul>
    </section>

    <section class="tab" id="tab-settings" hidden>
      <div class="group">
        <button class="wide" id="btn-folder"><svg class="i"><use href="#i-folder"/></svg> Папка с музыкой</button>
        <div class="hint" id="folder-label">не выбрана</div>
      </div>

      <div class="group">
        <button class="wide" id="btn-gif"><svg class="i"><use href="#i-image"/></svg> Выбрать GIF-фон</button>
        <button class="wide ghost" id="btn-gif-clear">Сбросить фон</button>
        <div class="chips" id="fit-chips">
          <button data-fit="cover">Заполнить</button>
          <button data-fit="contain">Вписать</button>
        </div>
      </div>

      <div class="group">
        <label>Затемнение фона</label>
        <input class="fancy" type="range" id="dim" min="0" max="0.9" step="0.01" />
      </div>

      <div class="group">
        <label>Шаг перемотки</label>
        <div class="chips" id="skip-chips">
          <button data-sec="5">5с</button>
          <button data-sec="10">10с</button>
          <button data-sec="30">30с</button>
          <button data-sec="60">1м</button>
          <button data-sec="120">2м</button>
        </div>
      </div>

      <div class="group">
        <label class="check"><input type="checkbox" id="autoplay" /> Автоплей при запуске</label>
        <label class="check"><input type="checkbox" id="corner-on" /> Мини-панель в левом верхнем углу</label>
        <button class="wide ghost" id="btn-now-reset">Сбросить положение виджета</button>
      </div>
      <div class="group">
        <button class="wide" id="btn-discord">Подключить к Discord</button>
        <div class="hint" id="discord-status">отключено</div>
        <label class="check"><input type="checkbox" id="mute-local" /> Заглушить локально</label>
        <button class="wide ghost" id="btn-discord-cfg">Открыть файл с токеном</button>
      </div>
    </section>

    <div class="dock">
      <div class="seek">
        <span id="time-cur">0:00</span>
        <input class="fancy" type="range" id="seek" min="0" max="100" value="0" step="0.1" />
        <span id="time-dur">0:00</span>
      </div>
      <div class="controls">
        <button class="icon-btn small" id="btn-shuffle" title="Перемешать"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="btn-prev" title="Предыдущий"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="icon-btn" id="btn-back"><svg class="i"><use href="#i-back"/></svg></button>
        <button class="icon-btn play" id="btn-play"><svg class="i js-play-ico"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="btn-fwd"><svg class="i"><use href="#i-fwd"/></svg></button>
        <button class="icon-btn" id="btn-next" title="Следующий"><svg class="i"><use href="#i-next"/></svg></button>
        <button class="icon-btn small" id="btn-repeat" title="Повтор"><svg class="i"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="volrow">
        <svg class="i"><use href="#i-vol"/></svg>
        <input class="fancy" type="range" id="volume" min="0" max="1" step="0.01" />
        <span id="vol-val"></span>
      </div>
    </div>
  </aside>

  <audio id="audio"></audio>
  <script src="renderer.js"></script>
</body>
</html>
